<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Command Generator</title>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4659624818164596" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #161b22; padding: 25px; border-radius: 10px; border: 1px solid #30363d; width: 100%; max-width: 600px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { color: #58a6ff; text-align: center; margin-top: 0; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { flex: 1; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 10px; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.2s; min-width: 80px; }
        .tab-btn.active { background: #1f6feb; border-color: #1f6feb; color: white; }
        .tab-btn:hover:not(.active) { background: #30363d; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #8b949e; font-size: 14px; }
        input[type="text"], select, input[type="file"] { width: 100%; box-sizing: border-box; padding: 10px; background: #010409; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; font-family: 'Courier New', monospace; outline: none; }
        input:focus, select:focus { border-color: #58a6ff; }
        input[type="file"] { background: #21262d; padding: 8px; cursor: pointer; }
        
        .output-wrapper { position: relative; margin-top: 25px; }
        .output-box { background: #000; padding: 15px; border-radius: 6px; border: 1px solid #3fb950; color: #3fb950; font-size: 15px; min-height: 50px; word-wrap: break-word; }
        .output-box::before { content: "$ "; color: #8b949e; }
        
        button.action-btn { background: #238636; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button.action-btn:hover { background: #2ea043; }
        
        .copy-btn { position: absolute; top: -15px; right: 10px; background: #1f6feb; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>>_ CMD Generator</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('ffmpeg')">FFmpeg</button>
        <button class="tab-btn" onclick="switchTab('ytdlp')">yt-dlp</button>
        <button class="tab-btn" onclick="switchTab('git')">Git</button>
        <button class="tab-btn" onclick="switchTab('python')">Python</button>
    </div>

    <!-- TAB: FFMPEG -->
    <div id="ffmpeg" class="tab-content active">
        <div class="input-group">
            <label>Pilih Aksi:</label>
            <select id="ffAction">
                <option value="compress">1. Kompres Video (H.265)</option>
                <option value="extract">2. Ekstrak Audio (MP3)</option>
                <option value="cut">3. Potong Video (Cut)</option>
            </select>
        </div>
        
        <div class="input-group">
            <label>Pilih File Video di HP:</label>
            <input type="file" id="filePicker" accept="video/*">
        </div>

        <div class="input-group">
            <label>Lokasi Folder (Pilih agar Termux tidak nyasar):</label>
            <select id="folderLocation" onchange="toggleCustomFolder()">
                <option value="/storage/emulated/0/DCIM/ScreenRecorder">Folder ScreenRecorder (DCIM)</option>
                <option value="/storage/emulated/0/ScreenRecorder">Folder ScreenRecorder (Luar)</option>
                <option value="/storage/emulated/0/Download">Folder Download</option>
                <option value="/storage/emulated/0/Movies">Folder Movies</option>
                <option value="/storage/emulated/0/DCIM/Camera">Folder Kamera (DCIM)</option>
                <option value="custom">⚙️ Ketik Lokasi Sendiri...</option>
            </select>
            <input type="text" id="customFolderInput" placeholder="Contoh: /storage/emulated/0/WhatsApp/Media" style="display:none; margin-top:10px;">
        </div>

        <div class="input-group">
            <label>Nama File Output (contoh: hasil.mp4):</label>
            <input type="text" id="ffOutput" value="hasil_proses.mp4">
        </div>
        <div class="input-group" id="ffTimeGroup" style="display:none;">
            <label>Waktu (Format HH:MM:SS):</label>
            <input type="text" id="ffTime" placeholder="Mulai - Selesai (00:00:10 - 00:00:30)">
        </div>
        <button class="action-btn" onclick="generateFFmpeg()">Generate Command</button>
    </div>

    <!-- TAB: YT-DLP, GIT, PYTHON (Sama seperti sebelumnya) -->
    <div id="ytdlp" class="tab-content">
        <div class="input-group"><label>Pilih Aksi:</label><select id="ytAction"><option value="full">Download Full Video</option><option value="clip">Potong Video Online</option></select></div>
        <div class="input-group"><label>Link Video:</label><input type="text" id="ytInput" placeholder="https://www.youtube.com/..."></div>
        <div class="input-group" id="ytTimeGroup" style="display:none;"><label>Waktu:</label><input type="text" id="ytTime" placeholder="00:15:00 - 00:15:30"></div>
        <button class="action-btn" onclick="generateYtdlp()">Generate Command</button>
    </div>

    <div id="git" class="tab-content">
        <div class="input-group"><label>Pilih Aksi:</label><select id="gitAction"><option value="push">Full Commit & Push</option><option value="clone">Clone Repository</option></select></div>
        <div class="input-group"><label>URL/Pesan:</label><input type="text" id="gitInput" value="feat: update script"></div>
        <button class="action-btn" onclick="generateGit()">Generate Command</button>
    </div>

    <div id="python" class="tab-content">
        <div class="input-group"><label>Pilih Aksi:</label><select id="pyAction"><option value="venv">Buat Virtual Env</option><option value="run">Jalankan Script (Nohup)</option></select></div>
        <div class="input-group"><label>Input:</label><input type="text" id="pyInput" value="main.py"></div>
        <button class="action-btn" onclick="generatePython()">Generate Command</button>
    </div>

    <div class="output-wrapper">
        <button id="copyBtn" class="copy-btn" onclick="copyCommand()">Copy</button>
        <div class="output-box" id="cmdOutput">Pilih tab, isi data, dan klik Generate...</div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    document.getElementById('ffAction').addEventListener('change', function() {
        document.getElementById('ffTimeGroup').style.display = (this.value === 'cut') ? 'block' : 'none';
    });
    document.getElementById('ytAction').addEventListener('change', function() {
        document.getElementById('ytTimeGroup').style.display = (this.value === 'clip') ? 'block' : 'none';
    });

    // Menampilkan kolom input folder manual jika opsi "Ketik Lokasi Sendiri..." dipilih
    function toggleCustomFolder() {
        const val = document.getElementById('folderLocation').value;
        document.getElementById('customFolderInput').style.display = (val === 'custom') ? 'block' : 'none';
    }

    function setOutput(cmd) {
        document.getElementById('cmdOutput').innerText = cmd;
        document.getElementById('copyBtn').style.display = 'block';
    }

    function generateFFmpeg() {
        const action = document.getElementById('ffAction').value;
        const filePicker = document.getElementById('filePicker');
        let folderLocation = document.getElementById('folderLocation').value;
        
        // Cek jika pengguna memilih folder custom
        if (folderLocation === 'custom') {
            folderLocation = document.getElementById('customFolderInput').value;
            if (!folderLocation) {
                alert("Harap ketik lokasi folder manual kamu!");
                return;
            }
        }

        const output = document.getElementById('ffOutput').value || 'hasil_proses.mp4';
        
        let inputName = 'input.mp4';
        if (filePicker.files.length > 0) {
            inputName = filePicker.files[0].name;
        } else {
            alert("Harap pilih file video terlebih dahulu!");
            return;
        }

        let ffmpegCmd = '';
        if (action === 'compress') {
            ffmpegCmd = `ffmpeg -i "${inputName}" -vcodec libx265 -crf 28 "${output}"`;
        } else if (action === 'extract') {
            ffmpegCmd = `ffmpeg -i "${inputName}" -q:a 0 -map a "${output.replace('.mp4', '.mp3')}"`;
        } else if (action === 'cut') {
            const time = document.getElementById('ffTime').value.split('-');
            const start = time[0] ? time[0].trim() : '00:00:00';
            const end = time[1] ? time[1].trim() : '00:00:30';
            ffmpegCmd = `ffmpeg -i "${inputName}" -ss ${start} -to ${end} -c copy "${output}"`;
        }
        
        const finalCmd = `cd ${folderLocation} && ${ffmpegCmd}`;
        setOutput(finalCmd);
    }

    function generateYtdlp() {
        const action = document.getElementById('ytAction').value;
        const input = document.getElementById('ytInput').value || 'LINK_VIDEO';
        let cmd = '';
        if (action === 'full') cmd = `yt-dlp "${input}"`;
        else if (action === 'clip') {
            const time = document.getElementById('ytTime').value.split('-');
            const start = time[0] ? time[0].trim() : '00:00:00';
            const end = time[1] ? time[1].trim() : '00:00:30';
            cmd = `yt-dlp --download-sections "*${start}-${end}" "${input}"`;
        }
        setOutput(`cd /storage/emulated/0/Download && ${cmd}`);
    }

    function generateGit() {
        const action = document.getElementById('gitAction').value;
        const input = document.getElementById('gitInput').value;
        setOutput(action === 'push' ? `git add .\ngit commit -m "${input}"\ngit push` : `git clone ${input}`);
    }

    function generatePython() {
        const action = document.getElementById('pyAction').value;
        const input = document.getElementById('pyInput').value;
        setOutput(action === 'venv' ? `python -m venv ${input}\nsource ${input}/bin/activate` : `nohup python ${input} > output.log 2>&1 &`);
    }

    function copyCommand() {
        const text = document.getElementById('cmdOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "Tersalin!";
            btn.style.background = "#238636";
            setTimeout(() => { btn.innerText = "Copy"; btn.style.background = "#1f6feb"; }, 2000);
        });
    }
</script>
</body>
</html>

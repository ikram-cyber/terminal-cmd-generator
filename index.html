<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Video Editor (WASM)</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4659624818164596" crossorigin="anonymous"></script>
    
    <!-- FFmpeg WebAssembly -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; width: 100%; max-width: 500px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #3fb950; margin-top: 0; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 25px; }
        
        .upload-box { border: 2px dashed #30363d; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #010409; }
        input[type="file"] { width: 100%; color: #c9d1d9; font-family: monospace; }
        
        select, input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px; background: #21262d; border: 1px solid #30363d; color: white; border-radius: 6px; margin-bottom: 15px; font-size: 15px; outline: none; }
        select:focus, input[type="text"]:focus { border-color: #3fb950; }
        
        button { background: #238636; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        button:hover { background: #2ea043; }
        button:disabled { background: #1a5c27; cursor: not-allowed; color: #8b949e; }
        
        #logConsole { background: #000; color: #3fb950; padding: 15px; border-radius: 6px; border: 1px solid #30363d; margin-top: 20px; font-family: monospace; font-size: 13px; text-align: left; height: 120px; overflow-y: auto; display: none; }
        
        #downloadBtn { display: none; background: #1f6feb; text-decoration: none; padding: 15px; border-radius: 6px; font-weight: bold; color: white; margin-top: 15px; }
        #downloadBtn:hover { background: #388bfd; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎥 Web Video Editor</h2>
    <p>Proses video langsung di browser tanpa Termux!</p>
    
    <div class="upload-box">
        <input type="file" id="videoFile" accept="video/mp4,video/x-m4v,video/*">
    </div>
    
    <select id="actionType">
        <option value="compress">1. Kompres Video (Kecilkan Ukuran)</option>
        <option value="extract">2. Ekstrak Audio (Jadikan MP3)</option>
        <option value="cut">3. Potong Video (Clipper)</option>
    </select>
    
    <!-- Kolom input waktu ini hanya akan muncul kalau tab "Potong Video" dipilih -->
    <div id="timeGroup" style="display:none;">
        <input type="text" id="timeInput" placeholder="Mulai - Selesai (contoh: 00:00:10 - 00:00:30)">
    </div>
    
    <button id="processBtn" onclick="processMedia()">Mulai Proses</button>
    
    <div id="logConsole">Menunggu instruksi...</div>
    
    <a id="downloadBtn" href="#">⬇️ Unduh Hasilnya</a>
</div>

<script>
    // Memunculkan kolom waktu khusus untuk aksi Potong Video
    document.getElementById('actionType').addEventListener('change', function() {
        document.getElementById('timeGroup').style.display = (this.value === 'cut') ? 'block' : 'none';
    });

    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ 
        log: true,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    const processBtn = document.getElementById('processBtn');
    const logConsole = document.getElementById('logConsole');
    const downloadBtn = document.getElementById('downloadBtn');

    function updateLog(text) {
        logConsole.style.display = 'block';
        logConsole.innerHTML += `> ${text}<br>`;
        logConsole.scrollTop = logConsole.scrollHeight;
    }

    async function processMedia() {
        const fileInput = document.getElementById('videoFile');
        if (!fileInput.files.length) {
            alert('Silakan pilih file video terlebih dahulu!');
            return;
        }

        const file = fileInput.files[0];
        const action = document.getElementById('actionType').value;
        
        if (file.size > 150 * 1024 * 1024) {
            alert('File terlalu besar! Maksimal 150MB agar browser tidak force close.');
            return;
        }

        processBtn.disabled = true;
        downloadBtn.style.display = 'none';
        logConsole.innerHTML = '';

        try {
            updateLog('Menyiapkan mesin FFmpeg di browser...');
            if (!ffmpeg.isLoaded()) {
                await ffmpeg.load();
            }

            updateLog('Membaca video ke dalam memori sementara...');
            ffmpeg.FS('writeFile', 'input_video', await fetchFile(file));

            updateLog('Sedang memproses... JANGAN TUTUP TAB INI!');
            
            ffmpeg.setProgress(({ ratio }) => {
                const percent = Math.round(ratio * 100);
                if (percent > 0 && percent <= 100) {
                    processBtn.innerText = `Memproses: ${percent}%`;
                }
            });

            let outName = '';
            let outType = '';

            if (action === 'compress') {
                outName = 'hasil_kompres.mp4';
                outType = 'video/mp4';
                await ffmpeg.run('-i', 'input_video', '-vcodec', 'libx264', '-crf', '28', '-preset', 'ultrafast', outName);
            } 
            else if (action === 'extract') {
                outName = 'hasil_audio.mp3';
                outType = 'audio/mp3';
                await ffmpeg.run('-i', 'input_video', '-q:a', '0', '-map', 'a', outName);
            } 
            else if (action === 'cut') {
                outName = 'hasil_potong.mp4';
                outType = 'video/mp4';
                const timeVal = document.getElementById('timeInput').value.split('-');
                const start = timeVal[0] ? timeVal[0].trim() : '00:00:00';
                const end = timeVal[1] ? timeVal[1].trim() : '00:00:30';
                // -c copy memotong video dengan kecepatan kilat tanpa render ulang
                await ffmpeg.run('-i', 'input_video', '-ss', start, '-to', end, '-c', 'copy', outName);
            }

            updateLog('Proses selesai! Menyiapkan file untuk diunduh...');
            
            const data = ffmpeg.FS('readFile', outName);
            const url = URL.createObjectURL(new Blob([data.buffer], { type: outType }));

            downloadBtn.href = url;
            downloadBtn.download = outName;
            downloadBtn.style.display = 'block';
            updateLog('Sukses!');

        } catch (error) {
            updateLog('ERROR: Gagal memproses. Pastikan format didukung.');
            console.error(error);
        } finally {
            processBtn.disabled = false;
            processBtn.innerText = 'Mulai Proses';
        }
    }
</script>

</body>
</html>
